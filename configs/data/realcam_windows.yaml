# Step 4: CPU window preparation and sample export; no model/adapter training.
paths:
  workspace_root: null
  data_root: public_data/RealCam-Vid/RealEstate10K
seed: 0
windows:
  rgb_frames: 125
  target_fps: 24
  height: 704
  width: 1280
  resize_mode: cover
  crop_mode: random  # one crop shared by every frame and the conditioning image
  max_time_error_seconds: 0.020833333333333332  # half a target-frame interval
  max_frame_gap_seconds: 0.0625  # split at gaps exceeding 1.5 target-frame intervals
  camera_time_tolerance_seconds: 0.002
  shot_mode: detect  # detect | annotated; annotated requires an entry for each video
  cut_thumbnail_size: 64
  cut_hist_bins: 16
  cut_mean_threshold: 0.35
  cut_hist_threshold: 0.60
  cut_min_mean_for_hist: 0.08  # suppress histogram-bin changes from small brightness shifts
export:
  count: 10  # 0 = index only; exported sequentially, one window per usable clip
  epoch: 0
  draw: 0
  codec: libx264
  crf: 18
  preset: medium
